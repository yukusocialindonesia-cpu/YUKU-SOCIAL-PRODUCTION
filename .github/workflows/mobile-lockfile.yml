name: Refresh mobile dependency lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-mobile-foundation
    paths:
      - "package.json"

permissions:
  contents: write

concurrency:
  group: yuku-mobile-lockfile
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/native-mobile-foundation
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync Capacitor dependency lockfile"
          git push origin HEAD:feature/native-mobile-foundation
