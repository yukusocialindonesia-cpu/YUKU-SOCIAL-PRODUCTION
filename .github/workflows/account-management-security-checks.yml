name: Account management security checks

on:
  push:
    branches:
      - feature/super-admin-account-management
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-edge-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4
      - name: Type-check account management
        run: deno check --node-modules-dir=auto supabase/functions/account-management/index.ts
      - name: Type-check admin management
        run: deno check --node-modules-dir=auto supabase/functions/admin-management/index.ts
      - name: Type-check push notifications
        run: deno check --config supabase/functions/yuku-push/deno.json --node-modules-dir=auto supabase/functions/yuku-push/index.ts
      - name: Type-check account deletion requests
        run: deno check --node-modules-dir=auto supabase/functions/account-deletion-request/index.ts
