name: YUKU Android Play Store release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: yuku-android-release
  cancel-in-progress: false

jobs:
  android-release:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-node@v4
        name: Set up Node.js
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        name: Set up Java
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Build production web bundle
        run: |
          npm run lint
          npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Prepare Android signing key
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yuku-upload-key.jks"
          test -s "$RUNNER_TEMP/yuku-upload-key.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/yuku-upload-key.jks" >> "$GITHUB_ENV"
      - name: Build signed Play Store AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Verify AAB exists
        run: test -s android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        name: Upload signed AAB
        with:
          name: yuku-android-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
