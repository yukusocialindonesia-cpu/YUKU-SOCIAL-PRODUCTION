name: Supabase local migration validation

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-local-migration-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-migrations:
    name: Replay migrations in disposable local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Start disposable local Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Replay the complete migration history
        run: supabase db reset --local

      - name: Run booking authorization policy contract
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/stage_i_booking_authorization_contract.sql
