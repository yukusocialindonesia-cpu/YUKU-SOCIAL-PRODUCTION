name: YUKU main build validation

on:
  push:
    branches:
      - main
      - fix/talent-media-moderation
      - feat/professional-services-categories
      - feat/independent-professional-provider-identity
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.*"
      - ".github/workflows/main-build-validation.yml"
      - "supabase/migrations/**"
  pull_request:
    branches:
      - main
      - fix/yuku-final-service-taxonomy
      - feat/independent-professional-provider-identity
      - design/beranda-premium-compact
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.*"
      - ".github/workflows/main-build-validation.yml"
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuku-main-validation
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build
