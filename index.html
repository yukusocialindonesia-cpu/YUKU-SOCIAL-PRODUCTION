  <body class="bg-[#F6F1FF] text-slate-800 antialiased selection:bg-purple-200 selection:text-purple-900">
    <div id="root">
      <div id="yuku-app-loading" aria-live="polite" style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#F6F1FF;font-family:'Plus Jakarta Sans',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;color:#6C1DC9">
          <img
            src="/icon-192.png"
            alt=""
            aria-hidden="true"
            class="yuku-loading-logo"
            width="64"
            height="64"
            fetchpriority="high"
          />
          <span style="font-size:12px;font-weight:700;letter-spacing:.02em">Memuat YUKU...</span>
        </div>
      </div>
      <style>
        .yuku-loading-logo {
          width: 64px;
          height: 64px;
          object-fit: contain;
          animation: yuku-logo-spin 1.8s linear infinite;
          filter: drop-shadow(0 4px 12px rgba(108, 29, 201, .18));
        }
        @keyframes yuku-logo-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
          .yuku-loading-logo { animation: none; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
