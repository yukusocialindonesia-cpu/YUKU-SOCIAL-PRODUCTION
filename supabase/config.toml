[functions.yuku-push]
# The function verifies signed-in user tokens itself and validates webhook requests
# with the dedicated x-yuku-push-secret header.
verify_jwt = false

[functions.account-management]
verify_jwt = true

[functions.xendit-webhook]
# Xendit does not send a Supabase user JWT. The handler validates
# x-callback-token before parsing or processing any payment callback.
verify_jwt = false
